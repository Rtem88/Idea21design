20,slug:lt("atmosfera-i-funktsiia","atmosfera-y-funcion","atmosphere-and-function"),title:lt("Атмосфера і функція: з чого починається простір","Atmósfera y función: el origen del espacio","Atmosphere and function: where a space begins"),kicker:oc,body:{uk:["Дизайн починається з розуміння людей і функцій простору. Для HoReCa важливі і атмосфера, яку відчуває гість, і практична логіка роботи закладу.","IDEA21Design поєднує естетику, функціональність та індивідуальне бачення. Концепцію і планування розглядаємо як частини одного процесу, пов’язаного з потребами конкретного бізнесу.","За потреби до роботи долучаються профільні спеціалісти й технологічні партнери. Для ресторанних просторів це допомагає узгоджувати інтер’єр із технологічними потребами кухні та бару."],es:["El diseño empieza por comprender a las personas y las funciones del espacio. En hostelería importan tanto la atmósfera que percibe el huésped como el funcionamiento práctico del establecimiento.","IDEA21Design combina estética, funcionalidad y una visión propia. La conceptualización y la distribución forman parte de un mismo proceso, vinculado a las necesidades de cada negocio.","Cuando es necesario, colaboran especialistas y socios técnicos. En restaurantes, esto permite coordinar el interior con las necesidades técnicas de la cocina y el bar."],en:["Design begins with understanding people and how a space functions. In hospitality, both the atmosphere a guest experiences and the practical operation of the venue matter.","IDEA21Design combines aesthetics, functionality and an individual vision. We see concept and spatial planning as parts of one process shaped by the needs of each business.","Specialists and technical partners join the project as needed. For restaurants, this helps align the interior with the technical requirements of the kitchen and bar."]},alt:lt("Концептуальна візуалізація атмосферного інтер’єру закладу","Visualización conceptual de un interior de hostelería","Concept visualisation of a hospitality interior"),seoDescription:lt("Чернетка матеріалу IDEA21Design про атмосферу і функцію простору в HoReCa.","Borrador de IDEA21Design sobre atmósfera y función en espacios de hostelería.","IDEA21Design draft article on atmosphere and function in hospitality spaces.")},{id:"character",status:"draft",image:"journal-character",cardImageHeight:460,slug:lt("vlasnyi-kharakter","caracter-propio","individual-character"),title:lt("Власний характер замість одного стилю","Carácter propio más allá de un estilo","Individual character beyond a single style"),kicker:oc,body:{uk:["Кожен проєкт має власну історію, контекст та індивідуальність. Тому авторський підхід IDEA21Design не обмежується одним впізнаваним стилем.","Понад 25 років професійного досвіду Тетяни Віровки та робота в різних культурних середовищах сформували відкритість до нових ідей і різних способів організації простору.","Ми шукаємо баланс між креативністю, функціональністю, комфортом і практичною реалізацією. Власний характер інтер’єру з’являється із поєднання цих складових."],es:["Cada proyecto tiene su propia historia, contexto e identidad. Por eso, el enfoque de autor de IDEA21Design va más allá de un único estilo reconocible.","Más de 25 años de experiencia profesional de Tetiana Virovka y el trabajo en distintos entornos culturales han fomentado una apertura a nuevas ideas y formas de organizar el espacio.","Buscamos el equilibrio entre creatividad, funcionalidad, comodidad y ejecución práctica. El carácter propio de un interior nace de la combinación de estos elementos."],en:["Every project has its own story, context and identity. That is why the individual approach of IDEA21Design extends beyond a single recognisable style.","More than 25 years of Tetiana Virovka’s professional experience and work across different cultural settings have shaped an openness to new ideas and ways of organising space.","We seek a balance between creativity, functionality, comfort and practical execution. An interior’s individual character emerges from the combination of these elements."]},alt:lt("Концептуальна візуалізація інтер’єру з власним характером","Visualización conceptual de un interior con carácter propio","Concept visualisation of an interior with its own character"),seoDescription:lt("Чернетка матеріалу IDEA21Design про авторський підхід без прив’язки до одного стилю.","Borrador de IDEA21Design sobre un enfoque de autor más allá de un único estilo.","IDEA21Design draft article on an individual approach beyond a single style.")},{id:"icone",status:"draft",image:"journal-capsule",cardImageHeight:540,slug:lt("icone-21-novyi-nastrii","icone-21-otra-atmosfera","icone-21-new-mood"),title:lt("ICÔNE 21: новий настрій без ремонту","ICÔNE 21: otra atmósfera sin reformas","ICÔNE 21: a new mood without renovation"),kicker:oc,body:{uk:["ICÔNE 21 by IDEA21Design — авторська концепція інтер’єрних капсул. Вони допомагають створювати атмосферу через ретельно підібрані предмети, матеріали, кольори та деталі.","Кожна капсула задумана як невелика завершена дизайнерська історія. Вона дає можливість оновити інтер’єр або змінити його настрій без масштабного ремонту.","Проєкт перебуває в розвитку: комплектація, ціни та комерційна модель уточнюються. На цьому етапі можна обговорити ідею та потреби вашого простору."],es:["ICÔNE 21 by IDEA21Design es un concepto de autor de cápsulas de interior. Crean una atmósfera a través de objetos, materiales, colores y detalles cuidadosamente seleccionados.","Cada cápsula se concibe como una pequeña historia de diseño completa. Permite renovar un interior o cambiar su ambiente sin una gran reforma.","El proyecto está en desarrollo: la composición, los precios y el modelo comercial se están definiendo. En esta fase podemos hablar sobre la idea y las necesidades de tu espacio."],en:["ICÔNE 21 by IDEA21Design is an original concept of interior capsules. They create atmosphere through carefully selected objects, materials, colours and details.","Each capsule is conceived as a small, complete design story. It offers a way to refresh an interior or change its mood without major renovation.","The project is in development: contents, pricing and the commercial model are being defined. At this stage, we can discuss the idea and the needs of your space."]},alt:lt("Концепт капсули атмосфери ICÔNE 21","Concepto de cápsula de atmósfera ICÔNE 21","ICÔNE 21 atmosphere capsule concept"),seoDescription:lt("Чернетка матеріалу про ICÔNE 21 — капсули атмосфери, що змінюють настрій простору без ремонту.","Borrador sobre ICÔNE 21: cápsulas de atmósfera que cambian un espacio sin reformas.","Draft article on ICÔNE 21 — atmosphere capsules that change a space’s mood without renovation.")}],KN=(e,t)=>ul.find(n=>n.slug[e]===t),af=e=>ul.find(t=>t.id===e),Sm={seo:{title:lt("Матеріали — IDEA21Design","Journal — IDEA21Design","Journal — IDEA21Design"),description:lt("Ідеї та деталі від IDEA21Design: атмосфера, характер простору та капсули ICÔNE 21.","Ideas y detalles de IDEA21Design: atmósfera, carácter del espacio y cápsulas ICÔNE 21.","Ideas and details from IDEA21Design: atmosphere, spatial character and ICÔNE 21 capsules.")}},lf=["uk","es","en"],qN="uk",Hy={uk:"UA",es:"ES",en:"EN"},GN={uk:"uk",es:"es",en:"en"},Em={uk:"uk-UA",es:"es-ES",en:"en-GB"},Eu=e=>!!e&&lf.includes(e),Z={home:(e,t)=>`/${e}${t?`#${t}`:""}`,icone:(e,t)=>`/${e}/icone-21${t?`#${t}`:""}`,journal:e=>`/${e}/journal`,article:(e,t)=>{const n=af(t);return n?`/${e}/journal/${n.slug[e]}`:`/${e}/journal`}};function YN(e){const t=e.split("/").filter(Boolean),n=Eu(t[0])?t[0]:qN;if(!Eu(t[0]))return{locale:n,route:{page:t.length?"notfound":"home"}};const[,r,i]=t;if(!r)return{locale:n,route:{page:"home"}};if(r==="icone-21"&&!i)return{locale:n,route:{page:"icone"}};if(r==="journal"&&!i)return{locale:n,route:{page:"journal"}};if(r==="journal"&&i&&t.length===3){const s=KN(n,i)??ul.find(o=>Object.values(o.slug).includes(i));return{locale:n,route:s?{page:"article",articleId:s.id}:{page:"not
